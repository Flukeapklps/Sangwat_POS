<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบ POS สั่งซื้อสินค้า</title>
  <!-- Tailwind CSS สำหรับตกแต่งหน้าตาให้สวยงามทันสมัย -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">

  <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">🛒 ระบบสั่งซื้อสินค้า POS</h1>

    <!-- ข้อมูลลูกค้าและประเภทการสั่งซื้อ -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
      <div>
        <label class="block text-gray-700 font-medium mb-2">ชื่อลูกค้า (Display Name)</label>
        <input type="text" id="customerName" placeholder="ระบุชื่อลูกค้าของคุณ" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-gray-700 font-medium mb-2">ประเภทการสั่งซื้อ</label>
        <select id="orderType" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="ปลีก">ราคาปลีก</option>
          <option value="ส่ง">ราคาส่ง</option>
        </select>
      </div>
    </div>

    <!-- รายการสินค้าจำลอง (สามารถปรับเปลี่ยนดึงจาก doGet ของ GAS ได้) -->
    <div class="mb-6">
      <h2 class="text-lg font-semibold text-gray-800 mb-3">📦 เลือกรายการสินค้า</h2>
      <div id="menuContainer" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- รายการสินค้าจะถูกโหลดมาแสดงที่นี่ หรือเพิ่มแบบสแตติกเบื้องต้น -->
        <div class="border p-4 rounded-lg flex flex-col justify-between">
          <div>
            <h3 class="font-bold text-gray-800">ข้าวหอมมะลิ 5 กก.</h3>
            <p class="text-sm text-gray-600">ราคาปลีก: 180 บาท | ราคาส่ง: 150 บาท</p>
          </div>
          <div class="mt-4 flex items-center justify-between">
            <span class="text-blue-600 font-bold">180 ฿</span>
            <button onclick="addToCart(1, 'ข้าวหอมมะลิ 5 กก.', 180, 50)" class="bg-blue-600 text-white px-3 py-1 rounded text-sm hover:bg-blue-700">เพิ่มลงตะกร้า</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ตะกร้าสินค้า -->
    <div class="mb-6 border-t pt-4">
      <h2 class="text-lg font-semibold text-gray-800 mb-3">🛍️ ตะกร้าสินค้าของคุณ</h2>
      <div id="cartList" class="bg-gray-50 p-4 rounded-lg mb-3 min-h-[80px]">
        <p class="text-gray-500 text-sm">ยังไม่มีสินค้าในตะกร้า</p>
      </div>
      <div class="text-right font-bold text-xl text-gray-800">
        ราคารวมทั้งหมด: <span id="totalPriceDisplay" class="text-green-600">0</span> บาท
      </div>
    </div>

    <!-- แนบสลิปโอนเงิน -->
    <div class="mb-6 border-t pt-4">
      <label class="block text-gray-700 font-medium mb-2">📸 แนบรูปสลิปการโอนเงิน</label>
      <input type="file" id="slipFileInput" accept="image/*" class="w-full border rounded-lg p-2 bg-gray-50">
    </div>

    <!-- ปุ่มยืนยันสั่งซื้อ -->
    <button id="submitBtn" onclick="submitOrder()" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition">
      ยืนยันการสั่งซื้อและส่งสลิป
    </button>
  </div>

  <script>
    // ตัวแปรเก็บตะกร้าสินค้า
    let cart = [];

    // ฟังก์ชันเพิ่มสินค้าลงตะกร้า (ตัวอย่าง)
    function addToCart(id, name, price, stock) {
      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ id: id, name: name, price: price, type: "ปลีก", qty: 1 });
      }
      renderCart();
    }

    // ฟังก์ชันแสดงผลตะกร้า
    function renderCart() {
      const cartList = document.getElementById("cartList");
      const totalPriceDisplay = document.getElementById("totalPriceDisplay");

      if (cart.length === 0) {
        cartList.innerHTML = '<p class="text-gray-500 text-sm">ยังไม่มีสินค้าในตะกร้า</p>';
        totalPriceDisplay.innerText = "0";
        return;
      }

      let html = '<ul class="divide-y divide-gray-200">';
      let total = 0;

      cart.forEach((item, index) => {
        let subtotal = item.price * item.qty;
        total += subtotal;
        html += `
          py-2 flex justify-between items-center">
            <div>
              <span class="font-medium">${item.name}</span>
              <span class="text-sm text-gray-500 ml-2">x${item.qty}</span>
            </div>
            <div class="flex items-center gap-4">
              <span class="font-semibold">${subtotal} ฿</span>
              <button onclick="removeFromCart(${index})" class="text-red-500 text-sm hover:underline">ลบ</button>
            </div>
          </li>
        `;
      });
      html += '</ul>';
      cartList.innerHTML = html;
      totalPriceDisplay.innerText = total;
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      renderCart();
    }

    // ฟังก์ชันส่งออเดอร์ไปยัง Google Apps Script
    async function submitOrder() {
      const displayName = document.getElementById("customerName").value.trim();
      const orderType = document.getElementById("orderType").value;
      const slipInput = document.getElementById("slipFileInput");

      if (!displayName) {
        alert("กรุณากรอกชื่อลูกค้าก่อนยืนยันออเดอร์ครับ!");
        return;
      }

      if (cart.length === 0) {
        alert("กรุณาเลือกสินค้าอย่างน้อย 1 รายการครับ!");
        return;
      }

      if (!slipInput.files || slipInput.files.length === 0) {
        alert("กรุณาแนบรูปสลิปการโอนเงินก่อนยืนยันออเดอร์ครับ!");
        return;
      }

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.innerText = "กำลังประมวลผลและอัปโหลดสลิป...";

      try {
        // แปลงไฟล์สลิปเป็น Base64
        const base64Slip = await convertFileToBase64(slipInput.files[0]);
        const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

        const payload = {
          displayName: displayName,
          orderType: orderType,
          items: cart,
          totalPrice: totalPrice,
          slipImage: base64Slip
        };

        // ⚠️ แทนที่ URL ด้านล่างนี้ด้วย Web App URL ล่าสุดจาก Google Apps Script ของพี่
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwzkCcKnFFNy14eRcWJbv2aXXmiol8dK1eJg5r0pMdaKAhYbpgq6ugFoGcLX3K3qKJq/exec";

        const response = await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.result === "success") {
          alert("🎉 สั่งซื้อสำเร็จและบันทึกข้อมูลลง Google Sheets เรียบร้อยแล้วครับ!");
          cart = [];
          renderCart();
          document.getElementById("customerName").value = "";
          slipInput.value = "";
        } else {
          alert("❌ เกิดข้อผิดพลาดจากระบบหลังบ้าน: " + (result.error || "ไม่ทราบสาเหตุ"));
        }

      } catch (error) {
        console.error("Error:", error);
        alert("⚠️ เกิดข้อผิดพลาดในการเชื่อมต่อ (Failed to fetch) กรุณาตรวจสอบลิงก์ Web App อีกครั้งครับ");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "ยืนยันการสั่งซื้อและส่งสลิป";
      }
    }

    // ฟังก์ชันแปลงไฟล์เป็น Base64
    function convertFileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }
  </script>
</body>
</html>
